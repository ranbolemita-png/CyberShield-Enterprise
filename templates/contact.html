<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberShield - Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <nav class="p-6 border-b border-slate-800 flex justify-between items-center max-w-7xl mx-auto w-full">
        <h1 class="text-2xl font-bold text-cyan-400">CyberShield</h1>
        <div class="space-x-6">
            <a href="/" class="hover:text-cyan-400 transition">Home</a>
            <a href="/services" class="hover:text-cyan-400 transition">Services</a>
            <a href="/about" class="hover:text-cyan-400 transition">About</a>
            <a href="/contact" class="text-cyan-400 font-semibold">Contact</a>
            <a href="/login" class="bg-cyan-600 px-4 py-2 rounded-lg hover:bg-cyan-500 font-semibold ml-4">Login</a>
        </div>
    </nav>
    <main class="max-w-xl mx-auto px-6 py-12 w-full">
        <h2 class="text-3xl font-bold text-cyan-300 mb-6 text-center">Contact Security Team</h2>
        <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-lg">
            <form onsubmit="event.preventDefault(); alert('Message sent successfully to CyberShield Security Operations!');">
                <div class="mb-4">
                    <label class="block text-slate-400 text-sm mb-2">Your Name</label>
                    <input type="text" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="mb-4">
                    <label class="block text-slate-400 text-sm mb-2">Email Address</label>
                    <input type="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="mb-6">
                    <label class="block text-slate-400 text-sm mb-2">Message</label>
                    <textarea rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-cyan-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 rounded-lg transition">Send Message</button>
            </form>
        </div>
    </main>
    <footer class="p-6 text-center border-t border-slate-800 text-slate-500 text-sm">© 2026 CyberShield Enterprise.</footer>
</body>
</html>
